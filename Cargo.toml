[package]
name = "microbit-learn"
version = "0.1.0"
edition = "2021"

[profile.release]
codegen-units = 1
debug = true
lto = true

[[bin]]
name = "uart-send"
path = "src/uart_mc_pc.rs"

[[bin]]
name = "uart-receive"
path = "src/uart_pc_mc.rs"

[[bin]]
name = "echo-server"
path = "src/uart-echo-srv.rs"

[dependencies]
cortex-m = "0.7.3"
cortex-m-rt = "0.7.0"
rtt-target = { version =  "0.3.1", features = ["cortex-m"] }
panic-rtt-target = { version =  "0.1.2", features = ["cortex-m"] }
microbit-v2 = "0.15.1"
embedded-hal-nb = "1.0.0"
nb = "1.1.0"
embedded-io = "0.6.1"
